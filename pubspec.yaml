name: exa_vortex
description: "An rythmic action game."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  native_assets_cli: ^0.13.0
  flutter_gpu_shaders: ^0.3.0
  vector_math: ^2.2.0
  rename_app: ^1.6.5
  path_provider: ^2.1.5
  rename: ^3.1.0
  flutter_soloud: ^3.5.4
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
  - build/shaderbundles/shaders.shaderbundle
  - .assets/
  - .assets/textures/
  - .assets/models/
  - .assets/fonts/

fonts:
  - family: Goldman
    fonts:
      - asset: .assets/fonts/Goldman-Regular.ttf
  - family: PressStart2P
    fonts:
      - asset: .assets/fonts/PressStart2P-Regular.ttf
